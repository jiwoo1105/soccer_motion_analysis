name: Tests
on:
  push:
  pull_request:
jobs:
  numeric-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-evaluation.txt
      - run: python -m pytest -q
      - run: python analyze_video.py --help
